<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾藏 · 本地收藏</title><link rel="stylesheet" href="/app.css"></head><body>
<header><div class="brand">◈ <b>拾藏</b><small>LOCAL COLLECTION · v0.1</small></div><input id="search" placeholder="搜索名称、标签、属性…" aria-label="搜索"><button id="import">导入文件 / 文件夹</button><button class="primary" id="new">＋ 新建收藏</button></header>
<div class="layout"><aside><button data-view="items">▦ 全部收藏 <span id="count"></span></button><button data-view="drafts">◷ 暂存区 <span id="draft-count"></span></button><p class="caption">按标签浏览</p><nav id="tags"></nav><div class="aside-bottom"><button data-view="manage">⚙ 标签与属性</button><a href="/api/export" download>↓ 导出数据 JSON</a><small>本地保存 · 文件按原路径引用</small></div></aside><main><div class="heading"><div><p class="eyebrow">YOUR PERSONAL ARCHIVE</p><h1 id="title">全部收藏</h1><p id="subtitle">让每一份收藏都有联系。</p></div><button id="toggle">列表视图</button></div><div id="content"></div></main><section id="detail"><div class="welcome"><div class="mark">◈</div><h2>从一份收藏开始</h2><p>选择对象查看属性与关联。<br>电影、演员、网页都可以独立存在。</p></div></section></div>
<dialog id="modal"><form id="modal-form"><div id="modal-content"></div><footer><button type="button" id="cancel">取消</button><button class="primary" type="submit">确定</button></footer></form></dialog><div id="toast" role="status" aria-live="polite"></div><script src="/app.js" defer></script></body></html>
