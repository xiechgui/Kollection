<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>连接拾藏</title><link rel="stylesheet" href="/app.css"></head><body class="login-page"><main class="login-card"><p class="eyebrow">KOLLECTION · MOBILE</p><h1>连接你的收藏库</h1><p class="muted">输入访问口令。局域网模式的口令显示在电脑启动窗口中；云端模式使用部署时设置的口令。</p><form id="login-form"><label class="field"><span>访问口令</span><input id="access-key" type="password" required autocomplete="current-password" autocapitalize="none" spellcheck="false"></label><button class="primary" type="submit">连接</button><p id="login-error" role="alert"></p></form><p class="muted">使用局域网模式时，电脑需保持运行，并连接可信 Wi-Fi。</p></main><script src="/login.js" defer></script></body></html>
