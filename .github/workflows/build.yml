name: Build Windows
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        run: dotnet build src/Collection.Web/Collection.Web.csproj -c Release
      - name: Integration smoke tests
        run: python tests/smoke.py
      - name: Mobile access and upload tests
        run: python tests/mobile.py
      - name: Cloud access and upload tests
        run: python tests/mobile.py --cloud
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install UI test dependencies
        run: npm ci --prefix tests
      - name: DOM and HTTP UI regression tests
        run: node tests/ui.mjs
      - name: Publish portable Windows x64
        run: dotnet publish src/Collection.Web/Collection.Web.csproj -c Release -r win-x64 --self-contained true -o artifacts/Shicang-win-x64
      - name: Include launcher and documentation
        shell: pwsh
        run: |
          Copy-Item scripts/Start.cmd artifacts/Shicang-win-x64/Start.cmd
          Copy-Item scripts/Start-Mobile.cmd artifacts/Shicang-win-x64/Start-Mobile.cmd
          Copy-Item README.md artifacts/Shicang-win-x64/README.md
          Compress-Archive -Path artifacts/Shicang-win-x64 -DestinationPath artifacts/Shicang-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Shicang-win-x64
          path: artifacts/Shicang-win-x64.zip
          retention-days: 14
